<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latihan CSS - Kartu Profil</title>
  <style>
    body { margin: 0; background: #f4f7fb; color: #172536; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(400px, 100%); padding: 20px; margin: 32px auto; box-sizing: border-box; }
    .profile-card {
      width: 300px;
      padding: 16px;
      margin-bottom: 20px;
      border: 2px solid #b8c9df;
      box-sizing: broder-box;
    }
    h2 { margin: 0; font-size: 21px; line-height: 1.25; }
    p { margin: 8px 0 0; }
  </style>
</head>
<body>
  <main>
    <article class="profile-card">
      <h2>Nadia Aulia</h2>
      <p>Suka desain dan teknologi.</p>
    </article>
    <article class="profile-card">
      <h2>Bima Pratama</h2>
      <p>Sedang belajar membuat website.</p>
    </article>
  </main>
</body>
</html>
